# Tanglish/English lexicon (PRD §7.4). Each entry: canonical form, role, optional value,
# variants by language. Extend from recordings; keep variants lowercase, punctuation-free.
stopwords: [a, an, the, for, me, my, to, is, it, of, please, can, you, i, in, on, and, um, uh, ok, okay, da, la, pa]
# Multi-word phrases rewritten to one token before lookup (after transliteration/tokenizing).
phrases:
  day after tomorrow: dayaftertomorrow
  day before yesterday: daybeforeyesterday
  naalu anaikku: naalanniki
  naalu annaikku: naalanniki
  naalu nanikku: naalanniki
  naal anaikku: naalanniki
  naalu thanikku: naalanniki
  naalu dhanikku: naalanniki
  naalu tanikku: naalanniki
  naala anaikku: naalanniki
  naalai marunaal: naalanniki
  naalaikku marunaal: naalanniki
  mundha naal: munthaanethu
  munthaa naal: munthaanethu
# Common colloquial Tamil words: no command role, but they count as "understood" for the confidence gate
# (so genuine Tanglish chat isn't rejected as noise).
vocab: [naan, nee, neenga, avan, aval, avanga, enakku, unakku, ungalukku, namakku, enna, ennadhu, epdi, eppadi, eppo,
  enga, yen, yaaru, edhu, sollu, sollunga, solla, solradhu, pannu, pannalaam, pannunga, venum, venam, irukku, irukkum,
  illa, illai, aamaa, seri, romba, nalla, nallaa, konjam, oru, ithu, idhu, adhu, anga, inga, appo, ippo, ippa, theriyuma,
  theriyum, theriyadhu, pesu, pesalaam, paadu, paattu, padam, saapadu, saapidalaam, saappaadu, nandri, pathi, kathai,
  kadhai, joke, mudiyuma, mudiyum, bore, adikkudhu, poren, varen, vaanga, ponga, ennoda, unnoda, unga, enga, kelvi,
  badhil, puriyala, purinjudhu, thamizh, tamil, ooru, veedu, velai, kaasu, panam, mazhai, veyil, kaathu, thanni, saami,
  kovil, school, college, office, friend, nanba, machaan, akka, anna, amma, appa, thambi, thangachi, paati, thaatha]
